<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TaskApp — prepínanie projektov</title>
    <meta http-equiv="Cache-Control" content="no-cache" />
    <!-- Poistka priamo v hlavičke: žiadny focus, nech sa deje čokoľvek s externým CSS. -->
    <style>
      * { -webkit-tap-highlight-color: transparent !important; }
      *:focus, *:focus-visible {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
      }
      *:focus-within { outline: none !important; }
      ::-moz-focus-inner { border: 0 !important; }
    </style>
    <link rel="stylesheet" href="styles.css?v=10" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>"
    />
  </head>
  <body>
    <!-- Prihlásenie (zobrazí sa len ak je zapnuté heslo) -->
    <div id="login" class="overlay hidden">
      <form id="login-form" class="card login-card">
        <h1>⏱️ TaskApp</h1>
        <p>Zadaj heslo</p>
        <input type="password" id="login-password" autocomplete="current-password" />
        <button type="submit">Prihlásiť</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>

    <div id="app" class="hidden">
      <!-- Aktuálny stav -->
      <section id="status" class="card status-idle">
        <div class="status-main">
          <div class="status-text">
            <div id="status-project" class="status-project">Nič nebeží</div>
            <div class="status-meta">
              <span id="status-timer" class="status-timer"></span>
              <span id="status-since" class="status-since"></span>
            </div>
          </div>
          <button id="stop-btn" class="btn-stop" title="Stop (S)" aria-label="Stop">
            <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
          </button>
        </div>
        <form id="note-form" class="note-form">
          <input
            id="note-input"
            class="note-input"
            type="text"
            placeholder="Poznámka — na čom pracujem…"
          />
          <button type="submit" id="note-save" class="btn-save" disabled title="Uložiť poznámku" aria-label="Uložiť poznámku">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </section>

      <!-- Projekty -->
      <section>
        <div class="section-head">
          <h2>Projekty</h2>
          <form id="new-project-form" class="new-project">
            <input id="new-project-name" type="text" placeholder="Nový projekt…" />
            <input id="new-project-color" type="color" value="#4f8cff" title="Farba" />
            <button type="submit">＋</button>
          </form>
        </div>
        <div id="projects" class="projects-grid"></div>
      </section>

      <!-- História -->
      <section>
        <div class="section-head">
          <h2>História</h2>
          <div class="range-toggle" id="history-range">
            <button data-range="today" class="active">Dnes</button>
            <button data-range="week">Tento týždeň</button>
          </div>
        </div>
        <div id="history" class="history"></div>
      </section>
    </div>

    <!-- Fatálna chyba (napr. nenakonfigurovaná databáza) -->
    <div id="fatal" class="overlay hidden">
      <div class="card fatal-card">
        <h1>⚠️ Appka sa nevie spustiť</h1>
        <p class="fatal-msg"></p>
        <button onclick="location.reload()">Skúsiť znova</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="app.js?v=10"></script>
  </body>
</html>
